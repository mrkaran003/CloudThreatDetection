{% extends "base.html" %}

{% block content %}

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/auth.css') }}">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="login-card">

                <h2 class="text-center mb-4">
                    🛡️ Create Account
                </h2>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="fullname"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Register

                    </button>

                </form>

                <div class="text-center mt-3">

                    <a href="/login">
                        Already have an account?
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
